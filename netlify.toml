[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# The site is a static export (next.config.ts sets output: "export"), so the
# published site is plain HTML/CSS/JS. Hashed build assets never change.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Screenshots and the logo are not hashed, so they get a long-but-finite cache.
# Netlify's CDN purges changed files on deploy, so an updated image still lands.
[[headers]]
  for = "/screens/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/Logo.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The case-study PDF is a large, unhashed download. Same treatment as the logo:
# a week of caching, and Netlify's CDN purges it on deploy so an updated deck lands.
[[headers]]
  for = "/EventDhondo_Case_Study.pdf"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
